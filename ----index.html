<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はじめのページ</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100vh;
      background: #08152f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    h1,
    img,
    button {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      color: #c4b5fd;
      font-family: sans-serif;
      font-size: 2.75rem;
      font-weight: 600;
      text-align: center;
    }

    img {
      display: block;
      max-width: 80vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      transition: transform 300ms ease, box-shadow 300ms ease;
    }

    img:hover {
      transform: translateY(-24px) scale(1.06) rotate(-2deg);
      box-shadow: 0 32px 60px rgba(0, 0, 0, 0.55);
    }

    button {
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #6d28d9;
      color: #fff;
      font: 600 1rem sans-serif;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <h1>ホームページ</h1>
  <img src="photo.png" alt="">
  <button type="button" onclick="location.href='next.html'">次のページへ</button>
  <script>
    const canvas = document.querySelector('#particles');
    const context = canvas.getContext('2d');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let particles = [];

    function createStar() {
      return {
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        radius: Math.random() * 3 + 1.5,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.035 + 0.015,
        color: Math.random() > 0.5 ? '109, 40, 217' : '255, 190, 60'
      };
    }

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width = `${innerWidth}px`;
      canvas.style.height = `${innerHeight}px`;
      context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      particles = Array.from(
        { length: Math.min(75, Math.floor(innerWidth / 17)) },
        createStar
      );
    }

    function draw() {
      context.clearRect(0, 0, innerWidth, innerHeight);
      context.globalCompositeOperation = 'lighter';

      particles.forEach((particle) => {
        const glow = (Math.sin(particle.phase) + 1) / 2;
        const size = particle.radius * (0.55 + glow * 0.75);
        context.fillStyle = `rgba(${particle.color}, ${0.15 + glow * 0.75})`;
        context.shadowColor = `rgb(${particle.color})`;
        context.shadowBlur = 12 * glow;
        context.beginPath();
        context.arc(particle.x, particle.y, size, 0, Math.PI * 2);
        context.fill();

        if (!reduceMotion) {
          particle.phase += particle.speed;
        }
      });

      context.shadowBlur = 0;
      context.globalCompositeOperation = 'source-over';

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    addEventListener('resize', () => {
      resize();
      if (reduceMotion) draw();
    });

    resize();
    draw();
  </script>
</body>
</html>
