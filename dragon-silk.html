<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>龍紋 — 光を紡ぐ</title>
<style>
:root{color-scheme:dark;font-family:"Yu Gothic","Meiryo",sans-serif;color:#e8eee9;background:#070e12}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #f4db9b;outline-offset:4px}.app{height:100svh;min-height:640px;display:flex;flex-direction:column;padding:24px 36px 18px;max-width:1800px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-family:"Yu Mincho",serif;font-weight:400;letter-spacing:.3em;font-size:28px;margin:0}h1 span{font-family:serif;font-size:11px;letter-spacing:.25em;color:#b3ac96;margin-left:18px}.edition{font-size:10px;letter-spacing:.2em;color:#93a3a6}.lead{font-family:"Yu Mincho",serif;font-size:14px;letter-spacing:.15em;color:#aebcbd;margin:12px 0 18px}.stage{position:relative;flex:1;min-height:300px;overflow:hidden;border:1px solid #233238;border-radius:18px;background:#03080d;box-shadow:0 20px 80px #0005}canvas{display:block;width:100%;height:100%;position:absolute;touch-action:none;cursor:crosshair}.stamp{position:absolute;top:20px;left:22px;pointer-events:none;color:#96aaaa;font-size:10px;letter-spacing:.24em}.hint{position:absolute;bottom:22px;left:20px;right:20px;text-align:center;font-size:12px;color:#a4b6bd;pointer-events:none;transition:opacity .5s}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 0 12px}.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.label{color:#91a5aa;font-size:11px;margin-right:7px;letter-spacing:.1em}button,select{border:1px solid #304249;color:#cbd9db;background:#111d22;border-radius:9px;padding:10px 14px;min-height:42px;font-size:12px;transition:background .2s,border-color .2s}button:hover{background:#21343b;border-color:#647d80}button[aria-pressed=true]{background:#20333b;border-color:#a5c5c8;color:#fff}button:disabled{opacity:.35;cursor:default}.color{display:inline-block;border-radius:50%;width:9px;height:9px;background:var(--dot);box-shadow:0 0 10px var(--dot);margin-right:8px}.save{background:#dfc28b;color:#142024;border-color:#dfc28b}.save:hover{background:#f1d9ab}.footer{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#84989c;letter-spacing:.08em}#status{min-height:16px} @media(max-width:700px){.app{padding:18px 14px 14px;min-height:730px}h1{font-size:24px}h1 span{font-size:9px;margin-left:10px}.edition{display:none}.lead{font-size:12px;line-height:1.8}.toolbar{gap:12px;padding-top:14px}.group{gap:6px}button,select{padding:10px 11px;min-height:44px}.label{display:none}.toolbar>.group:last-child{width:100%}.save{margin-left:auto}.footer{font-size:9px}.stamp{font-size:9px;left:16px}}
/* Keep the drawing's proportions on narrow screens, including the homepage dialog. */
@media(max-width:700px){
  .app{height:auto;min-height:100svh;padding:14px 12px 12px;justify-content:center}
  h1{font-size:22px}
  .lead{margin:8px 0 12px;font-size:11px;letter-spacing:.06em}
  .stage{flex:none;width:100%;min-height:0;aspect-ratio:16 / 11;border-radius:14px}
  .stamp{top:12px;left:12px}
  .hint{bottom:12px;left:8px;right:8px;font-size:10px}
  .toolbar{display:grid;grid-template-columns:1fr auto;gap:10px 6px;padding:12px 0 8px}
  .group{gap:4px;flex-wrap:nowrap}
  button,select{padding:8px 9px;min-height:44px;font-size:11px}
  .color{width:7px;height:7px;margin-right:4px}
  .toolbar>.group:last-child{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .toolbar>.group:last-child button{padding:8px 3px;white-space:nowrap}
  .save{margin-left:0}
  .footer{display:block;font-size:9px;line-height:1.6;letter-spacing:0}
  .footer>span:last-child{display:none}
}
.motion-controls{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.motion-controls button[aria-pressed=true]{color:#baffee;border-color:#6fc9b5;background:#163b39}
.record-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.record-controls span{font-size:11px;color:#aebcbd}.record-controls a{color:#f1d9ab;font-size:12px;padding:10px;border:1px solid #647d80;border-radius:9px}.record-preview{display:block;max-width:100%;width:360px;margin:0 0 12px;border-radius:10px}.record-preview[hidden],.record-controls [hidden]{display:none}#record[data-armed=true]{border-color:#f1d9ab;color:#f1d9ab}#record[data-recording=true]{border-color:#ff9393;color:#ffcaca}
</style>
</head>
<body><main class="app">
<header><h1>龍紋<span>RYUMON</span></h1><div class="edition">龍秘術® / LIGHT STUDY 01</div></header>
<p class="lead">指先から生まれる、あなただけの光の紋様。</p>
<section class="stage" aria-label="光の紋様を描くエリア"><canvas id="art" width="1600" height="1100" aria-label="押しながらなぞると光の線を描けます。描画見本ボタンでも紋様を作れます。">光の描画にはCanvas対応ブラウザーが必要です。</canvas><div class="stamp">光 を 紡 ぐ</div><div class="hint" id="hint">押しながら、ゆっくりなぞってみてください</div></section>
<div class="motion-controls"><button id="flow" aria-pressed="false">うねり OFF</button><button id="stardust" aria-pressed="false">星の粉 OFF</button><button id="afterglow" aria-pressed="false">余韻 OFF</button></div>
<div class="toolbar"><div class="group" aria-label="光の色"><span class="label">光の色</span><button data-hue="193" aria-pressed="true"><span class="color" style="--dot:#67d7ff"></span>青龍</button><button data-hue="40" aria-pressed="false"><span class="color" style="--dot:#f0cb78"></span>黄金</button><button data-hue="155" aria-pressed="false"><span class="color" style="--dot:#79e7b8"></span>翡翠</button></div>
<div class="group"><label class="label" for="symmetry">紋様</label><select id="symmetry" aria-label="紋様の対称性"><option value="2">左右対称</option><option value="5">五芒の紋</option><option value="6">六花の紋</option><option value="1">自由に描く</option></select></div>
<div class="group"><button id="demo">描画見本</button><button id="undo" disabled>ひとつ戻す</button><button id="clear">新しく描く</button><button id="save" class="save">画像を保存 ↗</button></div></div>
<div class="record-controls"><button id="record">10秒録画</button><a id="video-save" hidden>動画を保存 ↗</a><span id="record-status" role="status" aria-live="polite">ボタンを押してから描き始めると、10秒間録画します。</span></div>
<video id="record-preview" class="record-preview" controls playsinline hidden aria-label="録画した龍紋"></video>
<div class="footer"><span id="status" role="status" aria-live="polite">最初の光は見本です。そのまま描き足せます。</span><span>ゆっくり、心の向くままに。</span></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),W=1600,H=1100;
const status=document.getElementById('status'),hint=document.getElementById('hint'),undo=document.getElementById('undo');
let flowing=false;
let lingering=false,drift=null;
const afterglowButton=document.getElementById('afterglow');
afterglowButton.addEventListener('click',()=>{lingering=!lingering;afterglowButton.setAttribute('aria-pressed',String(lingering));afterglowButton.textContent=lingering?'余韻 ON':'余韻 OFF';if(!lingering&&drift)stop();setStatus(lingering?'余韻をONにしました。指を離すと光が少し泳ぎます。':'余韻をOFFにしました。')});
let sparkling=false,particles=[],sparkFrame=0,lastSpark=0;
const sparkCanvas=document.createElement('canvas');sparkCanvas.width=W;sparkCanvas.height=H;sparkCanvas.style.pointerEvents='none';sparkCanvas.setAttribute('aria-hidden','true');canvas.after(sparkCanvas);
const sparkCtx=sparkCanvas.getContext('2d'),sparkButton=document.getElementById('stardust');
function clearSparks(){cancelAnimationFrame(sparkFrame);sparkFrame=0;particles=[];sparkCtx.clearRect(0,0,W,H)}
sparkButton.addEventListener('click',()=>{sparkling=!sparkling;sparkButton.setAttribute('aria-pressed',String(sparkling));sparkButton.textContent=sparkling?'星の粉 ON':'星の粉 OFF';if(!sparkling)clearSparks();setStatus(sparkling?'星の粉をONにしました。なぞると小さな星が散って消えます。':'星の粉をOFFにしました。')});
function emitSparks(x,y){
const now=performance.now();if(!sparkling||now-lastSpark<25)return;lastSpark=now;
for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2,r=Math.random()*22;particles.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*(25+Math.random()*60),vy:Math.sin(a)*(25+Math.random()*60),born:now,life:800+Math.random()*700,size:2+Math.random()*4,hue,mode})}
if(particles.length>150)particles.splice(0,particles.length-150);if(!sparkFrame)sparkFrame=requestAnimationFrame(drawSparks);
}
function drawSparks(now){sparkCtx.clearRect(0,0,W,H);particles=particles.filter(p=>now-p.born<p.life);
for(const p of particles){const age=(now-p.born)/1000,fade=1-(now-p.born)/p.life,x=p.x+p.vx*age,y=p.y+p.vy*age+12*age*age;
const paint=()=>{sparkCtx.fillStyle=`hsla(${p.hue},95%,85%,${fade})`;sparkCtx.shadowColor=`hsl(${p.hue},95%,70%)`;sparkCtx.shadowBlur=12*fade;sparkCtx.beginPath();sparkCtx.arc(x,y,p.size*fade,0,Math.PI*2);sparkCtx.fill();sparkCtx.fillStyle=`rgba(255,255,255,${fade*.85})`;sparkCtx.fillRect(x-p.size*2,y-.6,p.size*4,1.2);sparkCtx.fillRect(x-.6,y-p.size*2,1.2,p.size*4)};
const count=p.mode===1?1:p.mode;for(let i=0;i<count;i++){sparkCtx.save();if(p.mode===2&&i){sparkCtx.translate(W,0);sparkCtx.scale(-1,1)}else if(p.mode>2){sparkCtx.translate(W/2,H/2);sparkCtx.rotate(i*Math.PI*2/count);sparkCtx.translate(-W/2,-H/2)}paint();sparkCtx.restore()}}
sparkFrame=particles.length?requestAnimationFrame(drawSparks):0;
}
const flowButton=document.getElementById('flow');
flowButton.addEventListener('click',()=>{flowing=!flowing;flowButton.setAttribute('aria-pressed',String(flowing));flowButton.textContent=flowing?'うねり ON':'うねり OFF';setStatus(flowing?'うねりをONにしました。次の線から変わります。「描画見本」でも試せます。':'うねりをOFFにしました。次の線から元の描き心地に戻ります。')});
let hue=193,mode=2,active=null,target={x:800,y:550},threads=[],frame=0,tail=0,phase=0,history=[];
const setStatus=t=>status.textContent=t;
function background(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#03080d';ctx.fillRect(0,0,W,H)}
function remember(){history.push(ctx.getImageData(0,0,W,H));if(history.length>5)history.shift();undo.disabled=false}
function stop(){if(frame)cancelAnimationFrame(frame);frame=0;active=null;threads=[];tail=0;drift=null;clearSparks()}
function makeThreads(x,y){threads=Array.from({length:28},(_,i)=>({x,y,vx:0,vy:0,lastX:x,lastY:y,angle:i*2.39996,k:.012+i*.0018,drag:.72+i*.0038}));phase=0}
function transforms(fn){if(mode===2){fn();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);fn();ctx.restore()}else if(mode===5||mode===6){for(let i=0;i<mode;i++){ctx.save();ctx.translate(W/2,H/2);ctx.rotate(i*Math.PI*2/mode);ctx.translate(-W/2,-H/2);fn();ctx.restore()}}else fn()}
function advance(x,y,power=1){phase+=flowing?.085:.055;ctx.globalCompositeOperation='lighter';threads.forEach((t,i)=>{const oldX=t.x,oldY=t.y;const d=Math.hypot(x-t.x,y-t.y);const sway=Math.min(24,d*.09);
// Nearby strands share a rolling wave, with a gradual phase offset across the ribbon.
const wave=phase+i*.075,amplitude=flowing?Math.min(85,25+d*.28):0;
const curlX=amplitude*(Math.sin(wave*1.7)+.35*Math.sin(wave*3.1));
const curlY=amplitude*(Math.cos(wave*1.3)+.3*Math.sin(wave*2.7));
t.vx=(t.vx+(x+curlX+Math.sin(phase+t.angle)*sway-t.x)*t.k)*t.drag;t.vy=(t.vy+(y+curlY+Math.cos(phase*.8+t.angle)*sway-t.y)*t.k)*t.drag;t.x+=t.vx;t.y+=t.vy;
ctx.lineWidth=flowing?(i%7===0?1.8:.8):(i%7===0?2:1.1);ctx.strokeStyle=`hsla(${hue+(i-14)*.65},85%,${60+i%5*4}%,${(flowing?.10+.14*Math.pow(Math.sin(wave),2):.24)*power})`;
transforms(()=>{ctx.beginPath();ctx.moveTo(oldX,oldY);ctx.lineTo(t.x,t.y);ctx.stroke();if(i>0&&i%2===0){const a=threads[i-1],dist=Math.hypot(t.x-a.x,t.y-a.y);if(dist>2&&dist<95){ctx.strokeStyle=`hsla(${hue},80%,65%,${.04*power})`;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.quadraticCurveTo((t.x+a.x)/2+t.vy*.7,(t.y+a.y)/2-t.vx*.7,a.x,a.y);ctx.stroke()}}});});ctx.globalCompositeOperation='source-over'}
function loop(now=performance.now()){
if(active===null&&drift){
const elapsed=Math.min(2.4,Math.max(0,(now-drift.start)/1000)),dt=Math.min(.035,Math.max(0,(now-drift.last)/1000));drift.last=now;
const fade=Math.pow(1-elapsed/2.4,2),angle=drift.angle+elapsed*2.5;
target.x+=Math.cos(angle)*drift.speed*fade*dt;target.y+=Math.sin(angle)*drift.speed*fade*dt;
advance(target.x,target.y,fade*.8);if(fade>.15)emitSparks(target.x,target.y);
if(elapsed<2.4){frame=requestAnimationFrame(loop);return}
drift=null;tail=0;frame=0;threads=[];setStatus('光が静まりました。描き足したり、画像を保存できます。');return;
}
if(active!==null)emitSparks(target.x,target.y);
if(active!==null||tail>0){advance(target.x,target.y,active!==null?1:Math.min(1,tail/35));if(active===null)tail--;frame=requestAnimationFrame(loop)}else{frame=0;threads=[]}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(active!==null||e.button!==0)return;e.preventDefault();stop();remember();active=e.pointerId;canvas.setPointerCapture(e.pointerId);target=point(e);makeThreads(target.x,target.y);hint.style.opacity=0;setStatus('光を紡いでいます');frame=requestAnimationFrame(loop)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===active)target=point(e)});
function release(e){if(e.pointerId!==active)return;active=null;
if(lingering&&e.type==='pointerup'){
const strand=threads[Math.floor(threads.length/2)],vx=strand?strand.vx:0,vy=strand?strand.vy:0,now=performance.now();
drift={start:now,last:now,angle:Math.hypot(vx,vy)>.1?Math.atan2(vy,vx):-Math.PI/2,speed:Math.min(240,90+Math.hypot(vx,vy)*12)};tail=0;setStatus('光が余韻を描いています…');
}else{tail=38;setStatus('いい紋様ができたら、画像として残せます。')}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
document.querySelectorAll('[data-hue]').forEach(b=>b.addEventListener('click',()=>{hue=Number(b.dataset.hue);document.querySelectorAll('[data-hue]').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));setStatus(b.textContent+'の光を選びました。次の線から変わります。')}));
document.getElementById('symmetry').addEventListener('change',e=>{mode=Number(e.target.value);setStatus('次の線から「'+e.target.selectedOptions[0].textContent+'」になります。')});
undo.addEventListener('click',()=>{stop();const prior=history.pop();if(prior)ctx.putImageData(prior,0,0);undo.disabled=!history.length;setStatus('ひとつ前の紋様に戻しました。')});
document.getElementById('clear').addEventListener('click',()=>{stop();remember();background();hint.style.opacity=1;setStatus('新しい光を描けます。「ひとつ戻す」で元に戻せます。')});
function demo(save=true){stop();if(save)remember();background();const strokes=[t=>({x:800+250*Math.sin(t*Math.PI*.95)*Math.sin(t*4.8+.3),y:140+t*810}),t=>({x:820+330*t+36*Math.sin(t*8),y:500-355*t+70*Math.sin(t*5)}),t=>({x:800+390*Math.sin(t*Math.PI*.85),y:680+110*Math.sin(t*7)-230*t}),t=>({x:810+185*Math.sin(t*3.8),y:480+400*t})];for(const path of strokes){const p=path(0);makeThreads(p.x,p.y);for(let i=0;i<240;i++){const p=path(i/239);advance(p.x,p.y,.88)}for(let i=0;i<25;i++){const p=path(1);advance(p.x,p.y,.45)}}threads=[];hint.style.opacity=1;if(save)setStatus('描画見本です。色や対称性を変えて、もう一度試せます。')}
document.getElementById('demo').addEventListener('click',()=>demo());
document.getElementById('save').addEventListener('click',()=>{canvas.toBlob(blob=>{if(!blob){setStatus('保存できませんでした。もう一度お試しください。');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ryumon-'+new Date().toISOString().slice(0,10)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);setStatus('紋様のPNG画像を保存しました。')},'image/png')});
const recordButton=document.getElementById('record'),recordStatus=document.getElementById('record-status'),videoSave=document.getElementById('video-save'),videoPreview=document.getElementById('record-preview');
const RECORDING_MS=10000;
let armed=false,recording=null,videoURL=null;
const recordingSupported=typeof MediaRecorder!=='undefined'&&typeof canvas.captureStream==='function';
if(!recordingSupported){recordButton.disabled=true;recordStatus.textContent='このブラウザーでは動画録画に対応していません。画像保存をご利用ください。'}
function resetRecordButton(){armed=false;recordButton.disabled=!recordingSupported;recordButton.textContent='10秒録画';delete recordButton.dataset.armed;delete recordButton.dataset.recording}
function finishRecording(){const session=recording;if(!session)return;clearTimeout(session.timer);cancelAnimationFrame(session.frame);if(session.recorder.state!=='inactive')session.recorder.stop()}
function startRecording(){
if(!armed||recording)return;
armed=false;delete recordButton.dataset.armed;
recordButton.disabled=true;
let stream;
try{
const composite=document.createElement('canvas');composite.width=1280;composite.height=880;const compositeCtx=composite.getContext('2d');
const paint=()=>{compositeCtx.drawImage(canvas,0,0,1280,880);compositeCtx.drawImage(sparkCanvas,0,0,1280,880)};paint();
stream=composite.captureStream(0);
const mime=['video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(type=>MediaRecorder.isTypeSupported(type));
const recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5000000}:{videoBitsPerSecond:5000000});
const session={recorder,stream,chunks:[],frame:0,timer:0,failed:false,started:performance.now(),interrupted:false};recording=session;
recorder.ondataavailable=e=>{if(e.data.size)session.chunks.push(e.data)};
recorder.onerror=()=>{session.failed=true;recordStatus.textContent='録画できませんでした。もう一度お試しください。';finishRecording()};
recorder.onstop=()=>{
clearTimeout(session.timer);cancelAnimationFrame(session.frame);session.stream.getTracks().forEach(track=>track.stop());recording=null;resetRecordButton();
if(session.failed)return;
const type=recorder.mimeType||session.chunks[0]?.type||'video/webm',blob=new Blob(session.chunks,{type});
if(!blob.size){recordStatus.textContent='動画を作成できませんでした。もう一度お試しください。';return}
videoPreview.pause();videoPreview.removeAttribute('src');videoPreview.load();if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(blob);
videoPreview.src=videoURL;videoPreview.hidden=false;videoSave.href=videoURL;videoSave.download='ryumon-'+new Date().toISOString().replace(/[:.]/g,'-')+(type.includes('mp4')?'.mp4':'.webm');videoSave.hidden=false;
recordStatus.textContent=session.interrupted?'画面を離れたため録画を終了しました。ここまでの動画を保存できます。':'10秒の録画ができました。「動画を保存」を押してください。';
};
recorder.start();session.timer=setTimeout(finishRecording,RECORDING_MS);recordButton.disabled=true;recordButton.dataset.recording='true';recordStatus.textContent='録画中です。そのまま自由に描いてください。';
const render=()=>{if(recording!==session)return;paint();stream.getVideoTracks()[0]?.requestFrame?.();recordButton.textContent='録画中 '+Math.max(1,Math.ceil((RECORDING_MS-performance.now()+session.started)/1000))+'秒';session.frame=requestAnimationFrame(render)};render();
}catch(error){if(recording){clearTimeout(recording.timer);cancelAnimationFrame(recording.frame);recording.recorder.onstop=null;recording.recorder.onerror=null;if(recording.recorder.state!=='inactive')recording.recorder.stop()}stream?.getTracks().forEach(track=>track.stop());recording=null;resetRecordButton();recordStatus.textContent='この環境では録画を開始できませんでした。別のブラウザーでお試しください。'}
}
recordButton.addEventListener('click',()=>{if(recording)return;armed=!armed;recordButton.dataset.armed=String(armed);recordButton.textContent=armed?'録画待ち・取消':'10秒録画';recordStatus.textContent=armed?'描き始めると録画が始まります。10秒間、自由になぞってください。':'ボタンを押してから描き始めると、10秒間録画します。'});
canvas.addEventListener('pointerdown',e=>{if(e.button===0&&active===e.pointerId)startRecording()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(recording){recording.interrupted=true;finishRecording()}stop()}});demo(false);
})();
</script></body></html>
